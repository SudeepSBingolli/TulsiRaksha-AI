<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TulsiRaksha-AI - Health Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .status-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .status-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #eee;
        }

        .status-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .status-value {
            color: #333;
            font-size: 24px;
            font-weight: bold;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #ee5a52;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .btn-success {
            background: #51cf66;
            color: white;
        }

        .btn-success:hover {
            background: #40c057;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(81, 207, 102, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .data-display {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 200px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .data-entry {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .data-entry.low {
            border-left-color: #51cf66;
        }

        .data-entry.normal {
            border-left-color: #ffd43b;
        }

        .data-entry.high {
            border-left-color: #ff6b6b;
        }

        .data-timestamp {
            color: #999;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .data-metrics {
            color: #333;
            margin-bottom: 5px;
        }

        .data-prediction {
            font-weight: bold;
            color: #667eea;
        }

        .data-prediction.low {
            color: #51cf66;
        }

        .data-prediction.normal {
            color: #ffd43b;
        }

        .data-prediction.high {
            color: #ff6b6b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card.low {
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
        }

        .stat-card.normal {
            background: linear-gradient(135deg, #ffd43b 0%, #f9ca24 100%);
        }

        .stat-card.high {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        .api-status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .api-status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .api-status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #28a745;
        }

        .status-dot.disconnected {
            background: #dc3545;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .settings {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .settings-group {
            margin-bottom: 15px;
        }

        .settings-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 13px;
        }

        .settings-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .controls, .status-bar, .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>❤️ TulsiRaksha-AI</h1>
            <p>Real-Time Health Prediction System</p>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <div class="status-label">Heart Rate</div>
                <div class="status-value" id="heartRate">-- bpm</div>
            </div>
            <div class="status-item">
                <div class="status-label">Prediction</div>
                <div class="status-value" id="prediction">--</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn-primary" id="startBtn" onclick="startStreaming()">▶ Start Streaming</button>
            <button class="btn-danger" id="stopBtn" onclick="stopStreaming()" disabled>⏹ Stop</button>
            <button class="btn-success" id="refreshBtn" onclick="refreshStats()">🔄 Refresh Stats</button>
            <button class="btn-primary" onclick="clearData()">🗑 Clear Data</button>
        </div>

        <!-- Data Display -->
        <div class="data-display" id="dataDisplay">
            <div style="text-align: center; color: #ccc; padding-top: 80px;">
                Click "Start Streaming" to begin
            </div>
        </div>

        <!-- Statistics -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card low">
                <div class="stat-label">LOW</div>
                <div class="stat-value" id="statLow">0</div>
            </div>
            <div class="stat-card normal">
                <div class="stat-label">NORMAL</div>
                <div class="stat-value" id="statNormal">0</div>
            </div>
            <div class="stat-card high">
                <div class="stat-label">HIGH</div>
                <div class="stat-value" id="statHigh">0</div>
            </div>
        </div>

        <!-- API Status -->
        <div class="api-status disconnected" id="apiStatus">
            <div class="status-dot disconnected"></div>
            <span id="apiStatusText">Disconnected - Set API endpoint below</span>
        </div>

        <!-- Settings -->
        <div class="settings">
            <div class="settings-group">
                <label>API Endpoint</label>
                <input type="text" id="apiEndpoint" placeholder="http://127.0.0.1:5000" value="http://127.0.0.1:5000">
            </div>
        </div>
    </div>

    <script>
        let isStreaming = false;
        let predictions = [];
        let eventSource = null;
        let dataCollectionInterval = null;

        // Get API endpoint from input or default
        function getApiEndpoint() {
            return document.getElementById('apiEndpoint').value || 'http://127.0.0.1:5000';
        }

        // Check API connection and start bridge
        async function checkApiConnection() {
            try {
                const response = await fetch(getApiEndpoint() + '/api', {
                    method: 'GET'
                });
                if (response.ok) {
                    const data = await response.json();
                    updateApiStatus(true);
                    
                    // Start bridge automatically
                    await startBridge();
                    return true;
                }
            } catch (e) {
                console.error('API Error:', e);
                updateApiStatus(false);
                return false;
            }
        }

        // Start the data collection bridge
        async function startBridge() {
            try {
                const response = await fetch(getApiEndpoint() + '/api/bridge/start', {
                    method: 'POST'
                });
                if (response.ok) {
                    console.log("✓ Bridge started");
                    return true;
                }
            } catch (e) {
                console.error('Error starting bridge:', e);
                return false;
            }
        }

        function updateApiStatus(connected) {
            const statusEl = document.getElementById('apiStatus');
            const statusText = document.getElementById('apiStatusText');
            const dot = statusEl.querySelector('.status-dot');

            if (connected) {
                statusEl.classList.remove('disconnected');
                statusEl.classList.add('connected');
                statusText.textContent = '✓ Connected to API';
                dot.classList.add('connected');
                dot.classList.remove('disconnected');
            } else {
                statusEl.classList.add('disconnected');
                statusEl.classList.remove('connected');
                statusText.textContent = '✗ Cannot connect to API';
                dot.classList.remove('connected');
                dot.classList.add('disconnected');
            }
        }

        // Start streaming
        async function startStreaming() {
            if (!await checkApiConnection()) {
                alert('❌ Cannot connect to API.\n\nMake sure:\n1. Unified API is running: python unified_api.py\n2. API endpoint is correct\n3. Smartwatch is connected');
                return;
            }

            isStreaming = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('dataDisplay').innerHTML = '';

            // Fetch live data and predictions continuously
            dataCollectionInterval = setInterval(fetchLiveData, 2000);
            
            // Fetch initial data
            fetchLiveData();
        }

        // Fetch from unified API
        async function fetchLiveData() {
            if (!isStreaming) return;

            try {
                const response = await fetch(getApiEndpoint() + '/api/predict-live', {
                    method: 'GET'
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.success && result.data) {
                        addPrediction(result.data);
                    }
                } else if (response.status === 503) {
                    // Bridge not ready yet
                    console.log("Bridge initializing...");
                }
            } catch (e) {
                console.error('Error fetching data:', e);
            }
        }

        // Add prediction to display
        function addPrediction(data) {
            // Extract data from unified API response
            const liveData = data.live_data || data;
            const prediction_result = data.risk || 'UNKNOWN';
            
            const prediction = {
                timestamp: new Date().toISOString(),
                heart_rate: liveData.heart_rate,
                battery: liveData.battery,
                risk: prediction_result
            };

            predictions.unshift(prediction);

            // Update display
            const display = document.getElementById('dataDisplay');
            const entry = document.createElement('div');
            entry.className = 'data-entry ' + prediction.risk.toLowerCase();

            const time = new Date(prediction.timestamp).toLocaleTimeString();
            entry.innerHTML = `
                <div class="data-timestamp">[${predictions.length}] ${time}</div>
                <div class="data-metrics">HR: ${prediction.heart_rate} bpm | Battery: ${prediction.battery}%</div>
                <div class="data-prediction ${prediction.risk.toLowerCase()}">Prediction: ${prediction.risk} RISK</div>
            `;

            display.insertBefore(entry, display.firstChild);

            // Keep only last 50
            while (display.children.length > 50) {
                display.removeChild(display.lastChild);
            }

            // Update status
            document.getElementById('heartRate').textContent = prediction.heart_rate + ' bpm';
            document.getElementById('prediction').textContent = prediction.risk;

            // Update stats
            updateStats();
        }

        // Update statistics
        function updateStats() {
            let lowCount = 0, normalCount = 0, highCount = 0;

            predictions.forEach(p => {
                if (p.risk === 'LOW') lowCount++;
                else if (p.risk === 'NORMAL') normalCount++;
                else if (p.risk === 'HIGH') highCount++;
            });

            document.getElementById('statLow').textContent = lowCount;
            document.getElementById('statNormal').textContent = normalCount;
            document.getElementById('statHigh').textContent = highCount;
        }

        // Stop streaming
        function stopStreaming() {
            isStreaming = false;
            if (dataCollectionInterval) {
                clearInterval(dataCollectionInterval);
                dataCollectionInterval = null;
            }
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }

        // Refresh stats
        function refreshStats() {
            updateStats();
            alert('Stats refreshed! Total predictions: ' + predictions.length);
        }

        // Clear data
        function clearData() {
            if (confirm('Clear all data?')) {
                predictions = [];
                document.getElementById('dataDisplay').innerHTML = '<div style="text-align: center; color: #ccc; padding-top: 80px;">Data cleared</div>';
                updateStats();
            }
        }

        // Check API on load
        window.addEventListener('load', () => {
            checkApiConnection();
            document.getElementById('apiEndpoint').addEventListener('change', checkApiConnection);
        });
    </script>
</body>
</html>
